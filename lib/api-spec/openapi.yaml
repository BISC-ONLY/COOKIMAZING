openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: store
    description: Public COOKIMAZING store operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /store/catalog:
    get:
      operationId: getStoreCatalog
      tags: [store]
      summary: Get the menu and order-day availability
      responses:
        "200":
          description: Current menu and order-day settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreCatalog"
  /orders:
    post:
      operationId: createOrder
      tags: [store]
      summary: Submit a pay-at-school order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/{reference}:
    get:
      operationId: getOrder
      tags: [store]
      summary: Retrieve a submitted order by reference
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: integer
          minimum: 0
        image:
          type: string
        toppingsAllowed:
          type: boolean
        cookieSelectionCount:
          type: integer
          minimum: 1
      required: [id, name, description, price, image, toppingsAllowed]
    Topping:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: integer
          minimum: 0
      required: [id, name, price]
    OrderDaySettings:
      type: object
      properties:
        days:
          type: array
          items:
            $ref: "#/components/schemas/Weekday"
        unavailableDays:
          type: array
          items:
            $ref: "#/components/schemas/Weekday"
      required: [days, unavailableDays]
    Weekday:
      type: string
      enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
    StoreCatalog:
      type: object
      properties:
        cookies:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        shakes:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        cookieToppings:
          type: array
          items:
            $ref: "#/components/schemas/Topping"
        drinkToppings:
          type: array
          items:
            $ref: "#/components/schemas/Topping"
        orderDays:
          $ref: "#/components/schemas/OrderDaySettings"
      required: [cookies, shakes, cookieToppings, drinkToppings, orderDays]
    SelectedTopping:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required: [id, name]
    OrderCookieSelectionInput:
      type: object
      properties:
        cookieId:
          type: string
        toppings:
          type: array
          items:
            $ref: "#/components/schemas/SelectedTopping"
      required: [cookieId, toppings]
    OrderCookieSelection:
      type: object
      properties:
        cookieId:
          type: string
        cookieName:
          type: string
        toppings:
          type: array
          items:
            $ref: "#/components/schemas/Topping"
      required: [cookieId, cookieName, toppings]
    OrderItemInput:
      type: object
      properties:
        productId:
          type: string
        productType:
          type: string
          enum: [cookie, shake]
        quantity:
          type: integer
          minimum: 1
          maximum: 30
        toppings:
          type: array
          items:
            $ref: "#/components/schemas/SelectedTopping"
        cookieSelections:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/OrderCookieSelectionInput"
      required: [productId, productType, quantity, toppings]
    OrderCustomerInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        className:
          type: string
          minLength: 1
          maxLength: 30
        yearGroup:
          type: string
          minLength: 1
          maxLength: 30
      required: [name, className, yearGroup]
    OrderInput:
      type: object
      properties:
        customer:
          $ref: "#/components/schemas/OrderCustomerInput"
        requestedWeekday:
          $ref: "#/components/schemas/Weekday"
        paymentMethod:
          type: string
          enum: [pay_at_school]
        specialNote:
          type: string
          maxLength: 500
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
      required: [customer, requestedWeekday, paymentMethod, items]
    OrderItem:
      type: object
      properties:
        productId:
          type: string
        productType:
          type: string
          enum: [cookie, shake]
        name:
          type: string
        quantity:
          type: integer
        toppings:
          type: array
          items:
            $ref: "#/components/schemas/Topping"
        cookieSelections:
          type: array
          items:
            $ref: "#/components/schemas/OrderCookieSelection"
        unitPrice:
          type: integer
        lineTotal:
          type: integer
      required: [productId, productType, name, quantity, toppings, unitPrice, lineTotal]
    Order:
      type: object
      properties:
        reference:
          type: string
        customer:
          $ref: "#/components/schemas/OrderCustomerInput"
        requestedWeekday:
          type: ["string", "null"]
          enum: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday, null]
        specialNote:
          type: ["string", "null"]
        paymentMethod:
          type: string
          enum: [pay_at_school]
        paymentStatus:
          type: string
          enum: [due_at_school]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [reference, customer, requestedWeekday, specialNote, paymentMethod, paymentStatus, items, total, createdAt]

