<style>
  #intro-screen {
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #intro-text {
    color: white;
    font-family: Inter, sans-serif;
    font-size: clamp(40px, 8vw, 90px);
    font-weight: 700;
    letter-spacing: 6px;
  }

  .intro-word {
    display: none;
  }

  .intro-word.show {
    display: block;
    animation: introPop 0.7s ease forwards;
  }

  @keyframes introPop {
    0% {
      opacity: 0;
      transform: scale(0.8);
    }

    60% {
      opacity: 1;
      transform: scale(1.08);
    }

    100% {
      opacity: 1;
      transform: scale(1);
    }
  }

  #intro-screen.hide {
    animation: introFadeOut 0.8s ease forwards;
    pointer-events: none;
  }

  @keyframes introFadeOut {
    to {
      opacity: 0;
      visibility: hidden;
    }
  }
  .hero-cta {
  display: none !important;
}
</style>

 <body>

  <div id="root"></div>

  <div id="intro-screen">
    <div id="intro-text">
      <span class="intro-word">ORDER</span>
      <span class="intro-word">EAT</span>
      <span class="intro-word">REPEAT</span>
    </div>
  </div>

<script src="./assets/index-DXqvEoz6.js?v=4"></script>

  <script>
  (function () {
      const screen = document.getElementById("intro-screen");
      const words = document.querySelectorAll(".intro-word");
      let current = 0;

      function showNextWord() {
          if (current > 0) {
              words[current - 1].classList.remove("show");
          }

          if (current < words.length) {
              words[current].classList.add("show");
              current++;
              setTimeout(showNextWord, 900);
          } else {
              setTimeout(function () {
                  screen.style.display = "none";
              }, 500);
          }
      }

      showNextWord();
  })();
  </script>
  <script>
(function () {
    const appFetch = window.fetch.bind(window);

    window.fetch = async function (input, options) {
        const url =
            typeof input === "string"
                ? input
                : input instanceof URL
                    ? input.href
                    : input && input.url;

        if (url) {
            const apiUrl = new URL(url, location.href);
            const path = apiUrl.pathname.replace(/^\/[A-Za-z]:/, "");

            const requestMethod = (
                options?.method ||
                (input instanceof Request ? input.method : "GET")
            ).toUpperCase();
if (
    path === "/api/store/catalog" &&
    requestMethod === "GET" &&
    location.protocol === "file:"
) {
    apiUrl.protocol = "http:";
    apiUrl.hostname = "localhost";
    apiUrl.port = 9999;
    apiUrl.pathname = path;

    const catalogResponse = await appFetch(apiUrl.href, options);
    const catalog = await catalogResponse.clone().json();

    const chocolate = catalog.shakes.find(
        item => item.id === "chocolate-shake"
    );

    const vanilla = catalog.shakes.find(
        item => item.id === "vanilla-shake"
    );

    if (chocolate) chocolate.image = "./Chocolate-Shake.jpg";
    if (vanilla) vanilla.image = "./images/Vannila-Shake.jpg";
    return new Response(JSON.stringify(catalog), {
        status: catalogResponse.status,
        headers: {
            "Content-Type": "application/json"
        }
    });
}
            if (
                path === "/api/orders" &&
                requestMethod === "POST" &&
                location.protocol === "file:"
            ) {
                apiUrl.protocol = "http:";
                apiUrl.hostname = "localhost";
                apiUrl.port = 9999;
                apiUrl.pathname = path;

                const localResponse = await appFetch(apiUrl.href, options);

                try {
                    if (localResponse.ok) {
                        const savedOrder =
                            await localResponse.clone().json();

                        appFetch(
                            "https://cookimazing-orders.robloxprogamer200.workers.dev/",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify(savedOrder)
                            }
                        ).catch(() => {});
                    }
                } catch {}

                return localResponse;
            }

            if (
                location.protocol === "file:" &&
                path.startsWith("/api/")
            ) {
                apiUrl.protocol = "http:";
                apiUrl.hostname = "localhost";
                apiUrl.port = 9999;
                apiUrl.pathname = path;

                return appFetch(apiUrl.href, options);
            }
        }

        return appFetch(input, options);
    };
})();
</script>
