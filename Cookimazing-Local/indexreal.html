  <script>
    (function () {
      const screen = document.getElementById("intro-screen");
      const words = document.querySelectorAll(".intro-word");
      let current = 0;

      function showNextWord() {
        if (current > 0) {
          words[current - 1].classList.remove("show");
        }

        if (current < words.length) {
          words[current].classList.add("show");
          current++;
          setTimeout(showNextWord, 900);
        } else {
          setTimeout(function () {
            screen.classList.add("hide");
            setTimeout(function () {
              screen.style.display = "none";
            }, 850);
          }, 500);
        }
      }

      showNextWord();
    })();
  </script>

  <!-- Local API and Cloudflare forwarding -->
  <script>
    (function () {
      const appFetch = window.fetch.bind(window);

      window.fetch = async function (input, options) {
        const url =
          typeof input === "string"
            ? input
            : input instanceof URL
              ? input.href
              : input && input.url;

        if (!url) {
          return appFetch(input, options);
        }

        let apiUrl;

        try {
          apiUrl = new URL(url, location.href);
        } catch {
          return appFetch(input, options);
        }

        const path = apiUrl.pathname.replace(/^\/[A-Za-z]:/, "");

        const requestMethod = (
          options?.method ||
          (input instanceof Request ? input.method : "GET")
        ).toUpperCase();

        if (location.protocol === "file:" && path === "/api/store/catalog" && requestMethod === "GET") {
          apiUrl.protocol = "http:";
          apiUrl.hostname = "localhost";
          apiUrl.port = "9999";
          apiUrl.pathname = path;

          const catalogResponse = await appFetch(apiUrl.href, options);
          const catalog = await catalogResponse.clone().json();

          const chocolate = catalog.shakes?.find(
            item => item.id === "chocolate-shake"
          );

          const vanilla = catalog.shakes?.find(
            item => item.id === "vanilla-shake"
          );

          if (chocolate) chocolate.image = "./Chocolate-Shake.jpg";
          if (vanilla) vanilla.image = "./Vannila%20Shake.jpg";

          return new Response(JSON.stringify(catalog), {
            status: catalogResponse.status,
            headers: {
              "Content-Type": "application/json"
            }
          });
        }

        if (location.protocol === "file:" && path === "/api/orders" && requestMethod === "POST") {
          apiUrl.protocol = "http:";
          apiUrl.hostname = "localhost";
          apiUrl.port = "9999";
          apiUrl.pathname = path;

          const localResponse = await appFetch(apiUrl.href, options);

          try {
            if (localResponse.ok) {
              const savedOrder = await localResponse.clone().json();

              appFetch(
                "https://cookimazing-orders.robloxprogamer200.workers.dev/",
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify(savedOrder)
                }
              ).catch(error => {
                console.error("Cloudflare order forwarding failed:", error);
              });
            }
          } catch (error) {
            console.error("Could not forward the saved order:", error);
          }

          return localResponse;
        }

        if (location.protocol === "file:" && path.startsWith("/api/")) {
          apiUrl.protocol = "http:";
          apiUrl.hostname = "localhost";
          apiUrl.port = "9999";
          apiUrl.pathname = path;

          return appFetch(apiUrl.href, options);
        }

        return appFetch(input, options);
      };
    })();
  </script>

  <!-- Fix shake images without changing the catalog or checkout flow -->
  <script>
    (function () {
      const imagePaths = {
        chocolate: "./Chocolate-Shake.jpg",
        vanilla: "./Vannila%20Shake.jpg"
      };

      function getProductName(card) {
        let element = card;

        for (let i = 0; i < 6 && element; i++) {
          const text = (element.innerText || "")
            .replace(/\s+/g, " ")
            .trim()
            .toLowerCase();

          if (
            text.includes("chocolate shake") &&
            !text.includes("oreo chocolate shake") &&
            !text.includes("vanilla shake")
          ) {
            return "chocolate";
          }

          if (
            text.includes("vanilla shake") &&
            !text.includes("oreo vanilla shake") &&
            !text.includes("chocolate shake")
          ) {
            return "vanilla";
          }

          element = element.parentElement;
        }

        return null;
      }

      function fixShakeCards() {
        document.querySelectorAll(".product-photo.fallback").forEach(function (card) {
          const product = getProductName(card);
          if (!product || card.dataset.photoFixed === product) return;

          const img = document.createElement("img");
          img.alt = product === "chocolate"
            ? "Chocolate Shake"
            : "Vanilla Shake";
          img.src = new URL(imagePaths[product], location.href).href;
          img.style.cssText =
            "width:100%;height:100%;object-fit:cover;display:block";

          img.onerror = function () {
            console.error("Shake image failed to load:", img.src);
          };

          card.replaceChildren(img);
          card.classList.remove("fallback");
          card.dataset.photoFixed = product;
        });
      }

      fixShakeCards();

      const root = document.getElementById("root");

      if (root) {
        new MutationObserver(fixShakeCards).observe(root, {
          childList: true,
          subtree: true
        });
      }
    })();
  </script>

  <!-- Diagnose cookie-image loading without interfering with checkout -->
  <script>
    (function () {
      document.addEventListener("error", function (event) {
        const img = event.target;

        if (!(img instanceof HTMLImageElement)) return;

        const src = img.getAttribute("src") || "";

        if (/mm-cookie\.png|smores-cookie\.png/i.test(src)) {
          console.error(
            "Cookimazing cookie image failed to load.",
            {
              image: src,
              resolvedURL: img.src,
              pageURL: location.href,
              hint: "Check the image URL and whether the image exists at that location."
            }
          );
        }
      }, true);
    })();
  </script>
